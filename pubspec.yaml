name: amar_dokan
description: "Amar Dokan - Inventory & Sales Management App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5

  # Local persistence
  shared_preferences: ^2.3.3
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

  # Icons (optional, for additional icons)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
